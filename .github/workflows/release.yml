name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build universal app
        run: scripts/build-app.sh --universal --version "${{ steps.version.outputs.version }}"

      - name: Package
        id: package
        run: |
          ZIP="Catification-${{ steps.version.outputs.version }}-macos-universal.zip"
          ditto -c -k --keepParent build/Catification.app "$ZIP"
          shasum -a 256 "$ZIP" > SHA256SUMS
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " { if (found) exit; if ($2 == v || index(v, $2) == 1) found = 1; next }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\n---\nFirst launch: the app is not notarized, see [Install](https://github.com/%s#install).\n' "$GITHUB_REPOSITORY" >> notes.md
          printf 'Built by [this workflow run](%s/%s/actions/runs/%s) from %s.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> notes.md

      - name: Draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: |
            ${{ steps.package.outputs.zip }}
            SHA256SUMS
